name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm check-types
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm build

  web-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web test

  ui-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # @repo/ui's styles import @repo/tokens' built CSS output directly, so it must
      # be built before testing or building the UI package.
      - name: Build design tokens
        run: pnpm turbo run build --filter=@repo/tokens

      - name: Install Playwright browsers
        run: pnpm --filter @repo/ui exec playwright install --with-deps chromium

      # @storybook/addon-a11y runs an Axe accessibility check after every story's play
      # function as part of this same Vitest run (see parameters.a11y in .storybook/preview.ts)
      # — there's no separate accessibility test command or build/serve step needed.
      - name: Run UI interaction and accessibility tests
        run: pnpm --filter @repo/ui test

      - name: Build Storybook
        run: pnpm --filter @repo/ui build-storybook