name: 'Chromatic Deployment'

on:
  push:
    paths:
      - 'packages/ui/**'
      - 'packages/tokens/**'

jobs:
  chromatic:
    name: 'Build and publish Storybook to Chromatic'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@repo/tokens
      - uses: chromaui/action@latest
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          token: ${{ secrets.GITHUB_TOKEN }}
          workingDir: packages/ui
          # Default behavior: the check fails until any detected visual changes are
          # reviewed and approved in Chromatic. Set true only to make this check
          # informational instead of a required gate.
          exitZeroOnChanges: false
